# CI do LAB03: roda os testes do pipeline de metricas DORA a cada push/PR que altere a pasta LAB03.
name: lab03-testes

on:
  push:
    paths:
      - "LAB03/**"
      - ".github/workflows/lab03-testes.yml"
  pull_request:
    paths:
      - "LAB03/**"
      - ".github/workflows/lab03-testes.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LAB03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --cov=metricas --cov-report=term-missing --cov-fail-under=80
